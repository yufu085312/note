# ===== RSS フィード設定 =====
feeds:
  # NHKニュース 主要ニュース（政治・経済・社会・国際・科学など全般）
  - url: "https://www.nhk.or.jp/rss/news/cat0.xml"
    tags: ["時事"]
  # livedoorニュース 主要（芸能・社会・ITなど幅広い話題）
  - url: "https://news.livedoor.com/topics/rss/top.xml"
    tags: ["話題"]

# 1回の実行で投稿する最大件数（レート制限・事故防止）
max_posts_per_run: 1

# 公開せず「下書き保存」までにする場合は true（最初は true 推奨）
draft_only: true

# 本文末尾に付ける引用元表記
append_source: true
source_template: "\n\n---\n出典: {title}\n{link}"

# ===== 整形設定 =====
formatter:
  # true: Claudeでトピック抽出しオリジナル記事を生成 / false: RSS要約をそのまま
  use_ai: true
  # 元記事URLから本文をフル取得してAIに渡すか（要約だけでは情報不足のため推奨）
  fetch_full_content: true
  # Geminiモデル（無料枠）。gemini-2.5-flash 推奨 / gemini-2.0-flash も可
  model: "gemini-2.5-flash"
  # 本文の目安・最大文字数（noteで読まれやすい1500〜2500字に合わせる）
  max_body_chars: 2500
  # 本文中に画像の挿入位置の目印（【画像候補】…）を入れるか
  image_placeholders: true

# ===== note エディタのセレクタ =====
# 実サイトの変更で壊れやすい部分。save_session.py で確認・調整可能。
note:
  login_url: "https://note.com/login"
  editor_url: "https://note.com/notes/new"
  storage_state: "storage_state.json"
  selectors:
    title: "textarea[placeholder*='タイトル'], input[placeholder*='タイトル']"
    body: "div[contenteditable='true']"
    publish_button: "button:has-text('公開')"
    publish_confirm: "button:has-text('公開する'), button:has-text('投稿')"
    save_draft_button: "button:has-text('下書き保存')"
