[mypy]
# サードパーティ製ライブラリ(playwright, feedparser, yaml, bs4, trafilatura,
# google.genai 等)は型情報(stub)を同梱していないため、import系の警告を抑制する。
ignore_missing_imports = True

# 個人用スクリプトなので、実行に無関係な厳格チェックは無効化する。
# assignment  : 属性を None で初期化→後で実体を代入、等
# attr-defined: Optional 属性に .foo アクセス（実行時は初期化後なのでOK）
# union-attr  : 同上（Union型へのアクセス）
# var-annotated: 変数の型注釈が無い、等
disable_error_code = assignment, attr-defined, union-attr, var-annotated, import-untyped, import-not-found
