name: note auto post

on:
  schedule:
    - cron: "0 11 */3 * *"   # 3日に1回 20:00 JST (毎月1,4,7,...日 / UTC 11:00)
  workflow_dispatch:        # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      # 投稿済み状態をキャッシュ（実行間で二重投稿を防ぐ）
      - name: Restore posted state
        uses: actions/cache@v4
        with:
          path: data/posted.json
          key: note-posted-${{ github.run_id }}
          restore-keys: note-posted-

      # storage_state.json（ログインセッション）だけ Secret から復元。
      # config.yaml はリポジトリにコミット済みのものをそのまま使う。
      - name: Restore login session
        run: echo "${{ secrets.STORAGE_STATE_JSON }}" | base64 -d > storage_state.json

      # 仮想ディスプレイ(xvfb)上で実ブラウザ表示モード(--headed)として実行。
      # note のヘッドレス検知を回避し、エディタを確実に描画させる。
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: xvfb-run -a python -m src.main --headed

      # 更新した投稿済み状態を保存
      - name: Save posted state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/posted.json
          key: note-posted-${{ github.run_id }}
